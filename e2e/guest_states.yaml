appId: in.aangan.app
---
- launchApp

# Guest sees login prompt on Wishlist tab
- tapOn: "Wishlist"
- assertVisible: "Log in to see your wishlist"

# Guest sees login prompt on Trips tab
- tapOn: "Trips"
- assertVisible: "Trips"

# Guest sees login prompt on Messages tab
- tapOn: "Messages"
- assertVisible: "Log in to see messages"

# Guest sees login prompt on Profile tab
- tapOn: "Profile"
- assertVisible: "Welcome to Aangan"

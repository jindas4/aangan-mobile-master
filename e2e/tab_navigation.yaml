appId: in.aangan.app
---
- launchApp
- assertVisible: "Explore"

# Navigate to Wishlist tab
- tapOn: "Wishlist"
- assertVisible: "Wishlist"

# Navigate to Trips tab
- tapOn: "Trips"
- assertVisible: "Trips"

# Navigate to Messages tab
- tapOn: "Messages"
- assertVisible: "Messages"

# Navigate to Profile tab
- tapOn: "Profile"
- assertVisible: "Profile"

# Back to Explore
- tapOn: "Explore"
- assertVisible: "Where to?"

appId: in.aangan.app
---
- launchApp

# Open login screen
- tapOn: "Profile"
- tapOn: "Log in"
- assertVisible: "Welcome back"

# Navigate to password reset flow
- tapOn: "Forgot password?"
- assertVisible: "Forgot your password?"
- assertVisible: "We'll email you a code to reset it."
- assertVisible: "Send reset code"

# Go back
- tapOn: "Back to log in"
- assertVisible: "Welcome back"
